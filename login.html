<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - República Magnatas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-container">
        <h2>Entrar na Área do Morador</h2>
        <form id="formLogin">
            <input type="email" id="email" placeholder="Seu E-mail" required>
            <input type="password" id="senha" placeholder="Sua Senha" required>
            <button type="submit" class="btn-vermelho">Entrar</button>
        </form>

        <p style="margin-top: 15px; text-align: center;">
            Não tem uma conta? <a href="registrar.html" style="color: #27ae60; font-weight: bold;">Cadastre-se</a>
        </p>

        <div id="mensagem-erro" class="mensagem-erro"></div>
        <div id="mensagem-sucesso" class="mensagem-sucesso"></div>
    </main>
    

    <script src="js/login.js"></script>
</body>
</html>
