<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se - República Magnatas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-container">
    <main class="login-container">
        <h2>Criar Conta na República</h2>
        <form id="formRegistrar">
            <input type="text" id="nome" placeholder="Seu Nome Completo" required>
            <input type="text" id="apelido" placeholder="Seu Apelido (como te chamam)" required>
            <input type="email" id="email" placeholder="Seu E-mail" required>
            <input type="password" id="senha" placeholder="Sua Senha" required>
            <button type="submit" class="btn-vermelho">Solicitar Acesso</button>
        </form>
        
        <!-- Mensagens de Feedback -->
        <div id="mensagem-erro" class="mensagem-erro" style="display: none;"></div>
        <div id="mensagem-sucesso" class="mensagem-sucesso" style="display: none;"></div>

        <p style="margin-top: 15px; text-align: center;">
            Já tem uma conta? <a href="login.html" style="color: #27ae60; font-weight: bold;">Faça login</a>
        </p>
    </main>

    <script src="js/registrar.js"></script>
</body>
</html>
