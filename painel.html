<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Morador - Magnatas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho-painel">
    <div class="cabecalho-esquerda">
        <!-- Confirme se o nome e o caminho da sua imagem da logo estão corretos aqui -->
        <img src="img/logo-magnatas.webp" alt="Logo Magnatas" class="logo-painel">
        <h2>Área do Morador - Magnatas</h2>
    </div>
    
    <div class="nav-painel">
        <a href="index.html" class="link-inicio">🏠 Início</a>
        <button onclick="fazerLogout()" class="btn-sair">SAIR</button>
    </div>
</header>

    <main class="container-painel">
        <!-- CAIXA EXCLUSIVA DO ADMIN (Escondida por padrão) -->
        <section id="caixaAdmin" class="caixa-admin" style="display: none;">
            <h3 class="titulo-admin">👑 Painel da Administração: Solicitações Pendentes</h3>
            <div id="listaPendentes">
                <!-- Os visitantes aparecerão aqui magicamente -->
            </div>
        </section>
        <section class="seccao-painel">
            <h2>Mural de Avisos</h2>
            
            <!-- Formulário para criar novos avisos -->
            <div class="formulario-adicionar">
                <input type="text" id="tituloAviso" placeholder="Título do Aviso" required>
                <textarea id="mensagemAviso" placeholder="O que queres avisar à malta?" required></textarea>
                <button id="btnCriarAviso" class="btn-vermelho pequeno">Publicar Aviso</button>
            </div>

            <!-- Lista onde os avisos vão aparecer -->
            <div id="listaAvisos" class="conteudo-dinamico">
                <!-- Os avisos vão aparecer aqui -->
            </div>
        </section>

        <section class="seccao-painel">
            <h2>Quadro de Faxina</h2>
            <div id="form-faxina" class="formulario-adicionar">
                <input type="text" id="descFaxina" placeholder="O que é para limpar? (ex: Cozinha)" required>
                <!-- NOVA CAIXA DE SELEÇÃO -->
                <select id="responsavelFaxina" required style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    <option value="">Carregando moradores...</option>
                </select>
                <input type="date" id="dataFaxina" required>
                <button id="btnCriarFaxina" class="btn-vermelho pequeno">Delegar Tarefa</button>
            </div>
            <div id="listaFaxina" class="conteudo-dinamico">
                <!-- As tarefas vão aparecer aqui -->
            </div>
        </section>

        <section class="seccao-painel">
            <h2>Despesas do Mês</h2>
            <div id="resumoFinanceiro" style="background: #e8f5e9; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; border: 1px solid #27ae60;">
                <!-- O JavaScript vai injetar a matemática aqui -->
            </div>

            <div class="formulario-adicionar">
                <input type="text" id="tipoDespesa" placeholder="Tipo (Luz, Água, Mercado)" required>
                <input type="text" id="descDespesa" placeholder="Descrição rápida" required>
                <input type="number" id="valorDespesa" step="0.01" placeholder="Valor (R$)" required>
                <button id="btnCriarDespesa" class="btn-vermelho pequeno">Registrar Despesa</button>
                <button id="btn-zerar-despesas" onclick="zerarDespesas()" style="display: none; width: 100%; background-color: #8b0000; color: white; border: none; padding: 10px; margin-top: 15px; cursor: pointer; font-weight: bold; border-radius: 4px;">
    ⚠️ Zerar Todas as Contas do Mês
</button>
            </div>
            <div id="listaDespesas" class="conteudo-dinamico">
                <!-- As despesas vão aparecer aqui -->
            </div>
        </section>
    </main>

    <script src="js/painel.js?v=999"></script>
</body>
</html>
